name: CI

# Gates every push and PR to main on the same checks Render runs at deploy,
# so a broken commit (syntax error, type error, failing test, broken build)
# is caught here rather than at deploy time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match the Node major version Render builds with.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values: auth-gated pages are force-dynamic so no real
          # backend is contacted at build time. These only need to exist so the
          # NEXT_PUBLIC_* inlining matches a production build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://example.com
